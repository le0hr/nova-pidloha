# novapidloha: acme only, until the cert exists

server {
    listen 80;
    server_name nova-pidloga-dveri.com www.nova-pidloga-dveri.com cms.nova-pidloga-dveri.com;
    access_log /var/log/nginx/access.log vhost;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 503; }
}
