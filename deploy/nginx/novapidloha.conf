# Install only after issuance. One certificate covers both names.
map $http_upgrade $nova_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name ${WEB_DOMAIN} ${CMS_DOMAIN};
    location ^~ /.well-known/acme-challenge/ {
        root ${NGINX_WEBROOT};
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name ${WEB_DOMAIN};
    ssl_certificate /etc/letsencrypt/live/${CERT_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${CERT_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    # Docker DNS is re-resolved after container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $nova_upstream http://nova-web:3000;
        proxy_pass $nova_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nova_connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    server_name ${CMS_DOMAIN};
    ssl_certificate /etc/letsencrypt/live/${CERT_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${CERT_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 110m;
    # Docker DNS is re-resolved after container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $nova_upstream http://nova-cms:1337;
        proxy_pass $nova_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nova_connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
