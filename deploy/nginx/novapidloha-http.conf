# Render only the explicit ${...} placeholders; preserve Nginx $variables.
server {
    listen 80;
    server_name ${WEB_DOMAIN} ${CMS_DOMAIN};
    location ^~ /.well-known/acme-challenge/ {
        root ${NGINX_WEBROOT};
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
