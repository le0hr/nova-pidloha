# novapidloha: web + cms

map $http_upgrade $nova_connection_upgrade {
    default upgrade;
    ''      close;
}

# http -> https
server {
    listen 80;
    server_name nova-pidloga-dveri.com www.nova-pidloga-dveri.com cms.nova-pidloga-dveri.com;
    access_log /var/log/nginx/access.log vhost;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

# www -> apex
server {
    listen 443 ssl;
    http2 on;
    server_name www.nova-pidloga-dveri.com;
    access_log /var/log/nginx/access.log vhost;

    ssl_certificate     /etc/letsencrypt/live/novapidloha/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novapidloha/privkey.pem;

    return 301 https://nova-pidloga-dveri.com$request_uri;
}

# web
server {
    listen 443 ssl;
    http2 on;
    server_name nova-pidloga-dveri.com;
    access_log /var/log/nginx/access.log vhost;

    ssl_certificate     /etc/letsencrypt/live/novapidloha/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novapidloha/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $nova_web http://nova-web:3000;
        proxy_pass $nova_web$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $nova_connection_upgrade;
        # streaming
        proxy_buffering off;
    }
}

# cms
server {
    listen 443 ssl;
    http2 on;
    server_name cms.nova-pidloga-dveri.com;
    access_log /var/log/nginx/access.log vhost;

    ssl_certificate     /etc/letsencrypt/live/novapidloha/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novapidloha/privkey.pem;

    # uploads
    client_max_body_size 110m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $nova_cms http://nova-cms:1337;
        proxy_pass $nova_cms$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $nova_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
