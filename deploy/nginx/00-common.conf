# common http settings

server_tokens  off;
tcp_nopush     on;
tcp_nodelay    on;

client_max_body_size  10m;

# log
log_format  vhost  '$host $remote_addr [$time_local] "$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';

# proxy
proxy_connect_timeout  10s;
proxy_send_timeout     120s;
proxy_read_timeout     120s;

# tls
ssl_protocols        TLSv1.2 TLSv1.3;
ssl_session_cache    shared:SSL:10m;
ssl_session_timeout  1d;

# gzip
gzip             on;
gzip_comp_level  5;
gzip_min_length  1024;
gzip_proxied     any;
gzip_vary        on;
gzip_types       text/plain text/css text/xml application/json application/javascript
                 application/xml application/rss+xml image/svg+xml font/woff2;
