[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "catalog-importer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1,<4", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "typer>=0.15,<1"]
[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.14", "ruff>=0.9", "types-openpyxl"]
[project.scripts]
catalog = "app.cli:cli"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
